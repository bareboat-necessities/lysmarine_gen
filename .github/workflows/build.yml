name: build_all

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-lite-raspios-trixie-arm64:
    name: build-lite-raspios-trixie-arm64
    runs-on: ubuntu-24.04-arm
    env:
      DOCKER_IMAGE: arm64v8/debian:trixie
      CONTAINER_DISTRO: debian:trixie
      PKG_RELEASE: raspios
      PKG_DISTRO: trixie
      PKG_ARCH: arm64
      BBN_KIND: LITE
      EMU: off

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move install-scripts
        run: mv install-scripts cross-build-release/

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install wget xz-utils

      - name: Make CI scripts executable
        run: chmod a+x ci/*.sh

      - name: Build
        run: ci/build-ci.sh
        timeout-minutes: 120

      - name: XZ compress image
        shell: bash
        run: |
          set -euo pipefail

          IMG="cross-build-release/release/raspios"
          test -f "$IMG"/*.img

          echo "Compressing: $IMG"/*.img
          # Use all cores; keep original (drop -k if runner disk gets tight)
          xz -T0 -9 -v -k "$IMG"/*.img

          ls -lh "$IMG" "$IMG/*.img.xz"

      - name: Upload artifact (.img.xz)
        uses: actions/upload-artifact@v4
        with:
          name: lysmarine-bbn-lite-trixie-raspios-arm64-img
          path: |
            cross-build-release/release/raspios/*.img.xz
          if-no-files-found: error
          compression-level: 0

      # Publish to GitHub Release only for tags v*
      - name: Publish GitHub Release asset (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          files: |
            cross-build-release/release/raspios/*.img.xz
